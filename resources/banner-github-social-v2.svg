    <path d="M12,12 H34 Q12,12 12,34 Z" fill="url(#gold)"/>
    <path d="M52,0 Q52,22 30,22 Q52,22 52,44" fill="none" stroke="#D9A441" stroke-width="1.6" opacity="0.0"/>
