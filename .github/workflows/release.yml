name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build with PyInstaller
        run: pyinstaller --onefile --noconsole --name NITREWRITTEN nwnmods.py
      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/NITREWRITTEN.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk libfuse2
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build with PyInstaller
        run: |
          pyinstaller --onefile --noconsole --name NITREWRITTEN nwnmods.py
          mv dist/NITREWRITTEN dist/NITREWRITTEN-linux
      - name: Build AppImage
        run: |
          set -e
          APPDIR=NITREWRITTEN.AppDir
          mkdir -p "$APPDIR/usr/bin" "$APPDIR/usr/share/applications" "$APPDIR/usr/share/icons/hicolor/512x512/apps"
          cp dist/NITREWRITTEN-linux "$APPDIR/usr/bin/NITREWRITTEN"
          chmod +x "$APPDIR/usr/bin/NITREWRITTEN"
          cat > "$APPDIR/NITREWRITTEN.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=NITREWRITTEN
          Comment=Mod Manager for Neverwinter Nights
          Exec=NITREWRITTEN
          Icon=pluma
          Terminal=false
          Categories=Game;Utility;
          EOF
          cp "$APPDIR/NITREWRITTEN.desktop" "$APPDIR/usr/share/applications/NITREWRITTEN.desktop"
          python -c "from PIL import Image; Image.new('RGBA', (512, 512), (77, 163, 255, 255)).save('pluma.png')"
          cp pluma.png "$APPDIR/pluma.png"
          cp pluma.png "$APPDIR/usr/share/icons/hicolor/512x512/apps/pluma.png"
          cat > "$APPDIR/AppRun" <<'EOF'
          #!/bin/sh
          SELF=$(readlink -f "$0")
          HERE=$(dirname "$SELF")
          export PATH="$HERE/usr/bin:$PATH"
          exec "$HERE/usr/bin/NITREWRITTEN" "$@"
          EOF
          chmod +x "$APPDIR/AppRun"
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool "$APPDIR" NITREWRITTEN-x86_64.AppImage
      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/NITREWRITTEN-linux
            NITREWRITTEN-x86_64.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
