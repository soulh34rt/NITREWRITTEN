name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Build with PyInstaller
        run: |
          pyinstaller --noconsole --onefile --name "NITREWRITTEN" nwnmods.py
      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        with:
          files: dist/NITREWRITTEN.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install python-appimage
      - name: Build AppImage
        run: |
          # Simplificado: En un entorno real se usaria appimagetool
          mkdir -p dist
          python -m python_appimage build tkinter nwnmods.py
          mv *.AppImage dist/NITREWRITTEN.AppImage || true
      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        with:
          files: dist/NITREWRITTEN.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
