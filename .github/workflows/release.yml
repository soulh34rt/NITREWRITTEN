name: Release

on:
  push:
    tags:
      - 'v*'
      - '1.0'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build with PyInstaller
        run: |
          pyinstaller --onefile --noconsole --name NITREWRITTEN nwnmods.py
      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        with:
          files: dist/NITREWRITTEN.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build with PyInstaller
        run: |
          pyinstaller --onefile --noconsole --name NITREWRITTEN nwnmods.py
      - name: Build AppImage
        run: |
          # Simple AppImage creation logic or just upload binary if AppImage tool is complex
          # For now, we'll provide the Linux binary. To make it a true AppImage we'd need appimagetool.
          # However, a standalone binary is often sufficient for these simple tools.
          mv dist/NITREWRITTEN dist/NITREWRITTEN-linux
      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        with:
          files: dist/NITREWRITTEN-linux
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
